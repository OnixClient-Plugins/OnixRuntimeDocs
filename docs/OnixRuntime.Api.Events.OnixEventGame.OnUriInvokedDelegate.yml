  assemblies:
  - OnixRuntime
  namespace: OnixRuntime.Api.Events
  summary: >-
    Called when a URI is invoked. specific to plugins. Not logic safe.

    The plugin uri that was invoked, the format goes as follows.

    minecraft://plugin.onixclient.com/{verb}?{key}={value}&amp;{myKey}={myValue}

    You should use this whenever possible to make it clear it's for plugins and avoid conflicts if you're implementing custom ones.
  example: []
  syntax:
    content: public delegate void OnixEventGame.OnUriInvokedDelegate(string verb, Dictionary<string, string> parameters)
    parameters:
    - id: verb
      type: System.String
      description: The verb that was invoked. what goes after minecraft://verb/
    - id: parameters
      type: System.Collections.Generic.Dictionary{System.String,System.String}
      description: The key-value parameters that were passed to the URI.
    content.vb: Public Delegate Sub OnixEventGame.OnUriInvokedDelegate(verb As String, parameters As Dictionary(Of String, String))
