  assemblies:
  - OnixRuntime
  namespace: OnixRuntime.Api.Events
  summary: >-
    Represents a method that is called to retrieve the hover text for a container screen when an item is hovered

    over. You can change or replace the text however you want, return the text that will be shown to the user.

    If you have no changes to make, you should return <code class="paramref">text</code>

    DO NOT USE <xref href="OnixRuntime.Api.Items.ItemStack.GetHoverText(OnixRuntime.Api.World.RuntimeWorld%2cSystem.Boolean%2cSystem.Boolean)" data-throw-if-not-resolved="false"></xref> or <xref href="OnixRuntime.Api.Items.ItemStack.GetHoverText(System.Boolean%2cSystem.Boolean)" data-throw-if-not-resolved="false"></xref> unless you set vanilla to true. Otherwise, you will get infinite recursion.
  example: []
  syntax:
    content: public delegate string OnixEventGui.OnContainerScreenHoverTextRequestedDelegate(ItemStack item, string text)
    parameters:
    - id: item
      type: OnixRuntime.Api.Items.ItemStack
      description: The <xref href="OnixRuntime.Api.Items.ItemStack" data-throw-if-not-resolved="false"></xref> representing the item being hovered over. This parameter cannot be <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/keywords/null">null</a>.
    - id: text
      type: System.String
      description: The current text of the item, changed by the ones who got it before you.
    return:
      type: System.String
      description: A <xref href="System.String" data-throw-if-not-resolved="false"></xref> that will be put as is in the hover text. If you don't wish to modify the text, return <code class="paramref">text</code>
    content.vb: Public Delegate Function OnixEventGui.OnContainerScreenHoverTextRequestedDelegate(item As ItemStack, text As String) As String
