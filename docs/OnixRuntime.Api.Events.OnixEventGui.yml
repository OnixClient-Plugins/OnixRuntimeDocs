    id: ContainerScreenHoverTextRequested
    path: ../OnixRuntime/OnixRuntime/Api/Events/OnixEventGui.cs
    startLine: 187
  assemblies:
  - OnixRuntime
  namespace: OnixRuntime.Api.Events
  summary: >-
    Occurs when the user hovers over an item in a container screen and the game requests the hover text to show.

    Technically it could happen at any time if a plugin or the client requests it in a different context but oh well, that's not an issue.

    DO NOT USE <xref href="OnixRuntime.Api.Items.ItemStack.GetHoverText(OnixRuntime.Api.World.RuntimeWorld%2cSystem.Boolean%2cSystem.Boolean)" data-throw-if-not-resolved="false"></xref> or <xref href="OnixRuntime.Api.Items.ItemStack.GetHoverText(System.Boolean%2cSystem.Boolean)" data-throw-if-not-resolved="false"></xref> unless you set vanilla to true. Otherwise, you will get infinite recursion.
  example: []
  syntax:
    content: public event OnixEventGui.OnContainerScreenHoverTextRequestedDelegate? ContainerScreenHoverTextRequested
    return:
      type: OnixRuntime.Api.Events.OnixEventGui.OnContainerScreenHoverTextRequestedDelegate
    content.vb: Public Event ContainerScreenHoverTextRequested As OnixEventGui.OnContainerScreenHoverTextRequestedDelegate
