  namespace: OnixRuntime.Api.Events
  summary: >-
    This event is called when on hud, hide hud is false and there is no client UI screen opened.

    This will be called from the user's preferred 2D renderer.

    This may or may not be a logic callback so don't access game state, entities, etc.
  example: []
  syntax:
    content: public delegate void OnixEventRendering.OnHudRender2DDelegate(RendererCommon2D gfx, float delta)
    parameters:
    - id: gfx
      type: OnixRuntime.Api.Rendering.RendererCommon2D
      description: The 2D renderer instance.
    - id: delta
      type: System.Single
      description: The time delta since the last frame.
    content.vb: Public Delegate Sub OnixEventRendering.OnHudRender2DDelegate(gfx As RendererCommon2D, delta As Single)
