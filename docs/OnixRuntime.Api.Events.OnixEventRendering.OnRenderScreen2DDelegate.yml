  assemblies:
  - OnixRuntime
  namespace: OnixRuntime.Api.Events
  summary: >-
    This event is called all the time.

    You should avoid this if <xref href="OnixRuntime.Api.Events.OnixEventRendering.HudRender" data-throw-if-not-resolved="false"></xref> gives you what you need.

    This will be called from the user's preferred 2D renderer.

    This may or may not be a logic callback so don't access game state, entities, etc.

    There is no PreRenderScreen2D event, because depending on the renderer, pre means different things.

    You can handle this case manually by checking the different pre events and <xref href="OnixRuntime.Api.Rendering.RenderContexes.MainRenderer" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: public delegate void OnixEventRendering.OnRenderScreen2DDelegate(RendererCommon2D gfx, float delta, string screenName, bool isHudHidden, bool isClientUI)
    parameters:
    - id: gfx
      type: OnixRuntime.Api.Rendering.RendererCommon2D
      description: The 2D renderer instance.
    - id: delta
      type: System.Single
      description: The time delta since the last frame.
    - id: screenName
      type: System.String
      description: The name of the screen being rendered.
    - id: isHudHidden
      type: System.Boolean
      description: Whether the HUD is hidden.
    - id: isClientUI
      type: System.Boolean
      description: Whether the UI is for the client.
    content.vb: Public Delegate Sub OnixEventRendering.OnRenderScreen2DDelegate(gfx As RendererCommon2D, delta As Single, screenName As String, isHudHidden As Boolean, isClientUI As Boolean)
