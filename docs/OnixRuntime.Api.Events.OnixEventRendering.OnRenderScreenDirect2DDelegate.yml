  namespace: OnixRuntime.Api.Events
  summary: >-
    This event is called all the time.

    You should avoid this if <xref href="OnixRuntime.Api.Events.OnixEventRendering.RenderHudDirect2D" data-throw-if-not-resolved="false"></xref> gives you what you need.

    This will never be a logic callback so don't access game state, entities, etc.
  example: []
  syntax:
    content: public delegate void OnixEventRendering.OnRenderScreenDirect2DDelegate(RendererDirect2D gfx, float delta, string screenName, bool isHudHidden, bool isClientUI)
    parameters:
    - id: gfx
      type: OnixRuntime.Api.Rendering.RendererDirect2D
      description: The Direct2D renderer instance.
    - id: delta
      type: System.Single
      description: The time delta since the last frame.
    - id: screenName
      type: System.String
      description: The name of the screen being rendered.
    - id: isHudHidden
      type: System.Boolean
      description: Whether the HUD is hidden.
    - id: isClientUI
      type: System.Boolean
      description: Whether the UI is for the client.
