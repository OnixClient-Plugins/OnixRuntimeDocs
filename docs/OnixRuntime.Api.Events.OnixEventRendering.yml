    path: ../OnixRuntime/OnixRuntime/Api/Events/OnixEventRendering.cs
    startLine: 258
  assemblies:
  - OnixRuntime
  namespace: OnixRuntime.Api.Events
  summary: >-
    This event is called all the time. The Pre is before the client AND game's screens are rendered.

    You should avoid this if <xref href="OnixRuntime.Api.Events.OnixEventRendering.HudRenderGame" data-throw-if-not-resolved="false"></xref> gives you what you need.

    debug_screen should always be there if you want to pick that one, otherwise you can ignore debug_screen and toast_screen to have just the main screen.

    This is a logic callback so you can access game state, entities, etc.
  example: []
  syntax:
    content: public event OnixEventRendering.OnPreRenderScreenDelegate? PreRenderScreenGame
    return:
      type: OnixRuntime.Api.Events.OnixEventRendering.OnPreRenderScreenDelegate
    content.vb: Public Event PreRenderScreenGame As OnixEventRendering.OnPreRenderScreenDelegate
