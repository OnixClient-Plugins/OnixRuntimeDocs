  assemblies:
  - OnixRuntime
  namespace: OnixRuntime.Api.Events
  summary: >-
    Delegate that is invoked whenever a block in the world changes. 

    Provides context about the region, position, old and new blocks, 

    as well as how the change should be propagated and rendered.
  example: []
  syntax:
    content: public delegate void OnixEventWorld.OnBlockChangedDelegate(WorldBlocks region, BlockPos position, Block oldBlock, Block newBlock, int layer, WorldBlocks.BlockUpdateType updateType)
    parameters:
    - id: region
      type: OnixRuntime.Api.World.WorldBlocks
      description: The <xref href="OnixRuntime.Api.World.WorldBlocks" data-throw-if-not-resolved="false"></xref> that did the change.///
    - id: position
      type: OnixRuntime.Api.Maths.BlockPos
      description: The <xref href="OnixRuntime.Api.Maths.BlockPos" data-throw-if-not-resolved="false"></xref> of the block that was modified.
    - id: oldBlock
      type: OnixRuntime.Api.World.Block
      description: The <xref href="OnixRuntime.Api.World.Block" data-throw-if-not-resolved="false"></xref> instance that previously occupied the position.
    - id: newBlock
      type: OnixRuntime.Api.World.Block
      description: The <xref href="OnixRuntime.Api.World.Block" data-throw-if-not-resolved="false"></xref> instance that replaced the old block.
    - id: layer
      type: System.Int32
      description: The layer, there are two layers. 0 is the main layer, 1 is generally used for waterlogging and things snow layers merging with some plants.
    - id: updateType
      type: OnixRuntime.Api.World.WorldBlocks.BlockUpdateType
      description: A <xref href="OnixRuntime.Api.World.WorldBlocks.BlockUpdateType" data-throw-if-not-resolved="false"></xref> flag that specifies how the update should be handled, such as updating neighbors, notifying the network, skipping graphics updates, or forcing priority updates.
    content.vb: Public Delegate Sub OnixEventWorld.OnBlockChangedDelegate(region As WorldBlocks, position As BlockPos, oldBlock As Block, newBlock As Block, layer As Integer, updateType As WorldBlocks.BlockUpdateType)
