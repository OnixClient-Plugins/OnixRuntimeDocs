  assemblies:
  - OnixRuntime
  namespace: OnixRuntime.Api.Maths
  summary: Specifies the handedness and depth range conventions for perspective matrices.
  remarks: >-
    This enumeration defines various combinations of handedness (left-handed or
        right-handed) and depth range conventions used in 3D graphics. These conventions are commonly used in
        graphics APIs such as Direct3D, Vulkan, and OpenGL. The values in this enumeration allow developers to
        specify the desired matrix convention for rendering or interacting with graphics systems.
  example: []
