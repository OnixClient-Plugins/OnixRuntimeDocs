  namespace: OnixRuntime.Api.Maths
  summary: Specifies the handedness of a 3D coordinate system used for rendering or transformations.
  remarks: >-
    Handedness determines the orientation of the coordinate system, which affects how
        objects are rendered and transformed in 3D space. This enumeration provides options for left-handed and
        right-handed systems, as well as a default value that depends on the underlying graphics library.
