  namespace: OnixRuntime.Api.OnixClient.Commands
  summary: >-
    The icon to show for this value, "" is no icon. Otherwise, it's the item name, optional ',' and then the item meta.

    You can also provide the .nbt wide save of the icon, starting with { and ending with }.

    Examples:

    "minecraft:stone"

    "minecraft:stone,1"

    """

    {"Block":{"name":"minecraft:wooden_button","states":{"button_pressed_bit":0b,"facing_direction":0},"version":15393},"Count":1b,"Damage":0s,"Name":"minecraft:wooden_button","WasPickedUp":0b}

    """
