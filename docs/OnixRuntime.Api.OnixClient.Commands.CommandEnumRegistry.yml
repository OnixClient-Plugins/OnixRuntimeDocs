  assemblies:
  - OnixRuntime
  namespace: OnixRuntime.Api.OnixClient.Commands
  summary: >-
    This is a registry for command enums, it lets you hold enum values, their icons, change and register them.

    This is what you use to make them available for command arguments of type enum.

    Soft enums are suggested values that can be added to at runtime, they don't have to be predefined and the user doesn't have to put one of those values.

    Enums are values that are predefined (you can change them later by re-registering the enum) and the user has to pick one of those values, nothing else.
