  summary: >-
    What actually runs the command. You should NOT override this unless you have a very good reason to.

    This will handle parsing the parameters and calling the correct overload.

    If you do override this, you probably also will need to override <xref href="OnixRuntime.Api.OnixClient.Commands.OnixCommandBase.GetOverloads" data-throw-if-not-resolved="false"></xref>.

    You should declare a function that does what you want and mark it with <xref href="OnixRuntime.Api.OnixClient.Commands.OnixCommandBase.OverloadAttribute" data-throw-if-not-resolved="false"></xref>.
