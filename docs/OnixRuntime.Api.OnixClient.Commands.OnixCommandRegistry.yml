  type: Method
  source:
    remote:
      path: OnixRuntime/Api/OnixClient/Commands/OnixCommandRegistry.cs
      branch: dev
      repo: https://github.com/OnixClient-Plugins/OnixRuntime.git
    id: ExtractCommandName
    path: ../OnixRuntime/OnixRuntime/Api/OnixClient/Commands/OnixCommandRegistry.cs
    startLine: 118
  assemblies:
  - OnixRuntime
  namespace: OnixRuntime.Api.OnixClient.Commands
  summary: Extracts the command name from a message string that starts with a specified prefix.
  remarks: >-
    This method assumes that the input message starts with the specified prefix.  If the
        prefix is not present, the behavior is undefined. The method also trims the prefix  and extracts the first
        word (delimited by a space) as the command name. If no space is found,  the entire remaining message is
        treated as the command name.
  example: []
  syntax:
    content: public string ExtractCommandName(string message, string prefix, out int consumed)
    parameters:
    - id: message
      type: System.String
      description: The input message string containing the command and its arguments.
    - id: prefix
      type: System.String
      description: The prefix that precedes the command in the message. This is used to identify the start of the command.
    - id: consumed
      type: System.Int32
      description: >-
        When this method returns, contains the number of characters consumed from the message,  including the prefix
            and the command name. This parameter is passed uninitialized.
    return:
      type: System.String
      description: >-
        The extracted command name as a string. If the message contains no arguments after the command,  the entire
            remaining portion of the message after the prefix is returned.
    content.vb: Public Function ExtractCommandName(message As String, prefix As String, consumed As Integer) As String
  overload: OnixRuntime.Api.OnixClient.Commands.OnixCommandRegistry.ExtractCommandName*
  nameWithType.vb: OnixCommandRegistry.ExtractCommandName(String, String, Integer)
  fullName.vb: OnixRuntime.Api.OnixClient.Commands.OnixCommandRegistry.ExtractCommandName(String, String, Integer)
  name.vb: ExtractCommandName(String, String, Integer)
