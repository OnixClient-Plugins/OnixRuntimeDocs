    startLine: 55
  assemblies:
  - OnixRuntime
  namespace: OnixRuntime.Api.OnixClient.Commands
  summary: Unregisters the specified command from the system, removing it from the appropriate execution targets.
  remarks: >-
    The method removes the command from the client-side, server-side, or both, depending
        on the  <xref href="OnixRuntime.Api.OnixClient.Commands.CommandExecutionTarget" data-throw-if-not-resolved="false"></xref> specified in the command. If the command is registered for both
        client and server execution, it will be removed from both contexts. After the command is unregistered,  the
        <xref href="OnixRuntime.Api.OnixClient.Commands.OnixCommandRegistry.OnCommandUnregistered(OnixRuntime.Api.OnixClient.Commands.OnixCommandBase)" data-throw-if-not-resolved="false"></xref> method is invoked to handle any additional cleanup or
        notifications.
  example: []
  syntax:
    content: public void UnregisterCommand(OnixCommandBase command)
    parameters:
    - id: command
      type: OnixRuntime.Api.OnixClient.Commands.OnixCommandBase
      description: The command to unregister. This cannot be <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/keywords/null">null</a>.
    content.vb: Public Sub UnregisterCommand(command As OnixCommandBase)
  overload: OnixRuntime.Api.OnixClient.Commands.OnixCommandRegistry.UnregisterCommand*
