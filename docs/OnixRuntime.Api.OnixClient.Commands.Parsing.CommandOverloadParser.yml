  summary: Tries to parse the overload from the first token of a sequence.
  example: []
  syntax:
    content: public static CommandOverloadParser.ParseResult Parse(Token firstToken, CommandOverload overload, int cursorPosition, bool computeAutoComplete)
    parameters:
    - id: firstToken
      type: OnixRuntime.Api.OnixClient.Commands.Parsing.Token
      description: The first token to start parsing from.
    - id: overload
      type: OnixRuntime.Api.OnixClient.Commands.CommandOverload
      description: The overload we're trying to parse.
    - id: cursorPosition
      type: System.Int32
      description: The position of the cursor for the autocomplete. Use 0 when <code class="paramref">computeAutoComplete</code> is false, if you don't have it make it the length of the input text.
    - id: computeAutoComplete
      type: System.Boolean
      description: Whether or not to compute the auto complete options, this also changes the behavior compared to parsing for execution, being a little more lenient to incomplete values.
