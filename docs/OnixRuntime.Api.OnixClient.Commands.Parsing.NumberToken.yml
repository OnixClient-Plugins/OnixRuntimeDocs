  assemblies:
  - OnixRuntime
  namespace: OnixRuntime.Api.OnixClient.Commands.Parsing
  summary: Represents a token that contains a numeric value, parsed from a source string.
  remarks: >-
    The numeric value is parsed into both integer and floating-point representations, if
        possible.  The <xref href="OnixRuntime.Api.OnixClient.Commands.Parsing.NumberToken.IsInt" data-throw-if-not-resolved="false"></xref> property indicates whether the value is an integer.
  example: []
  syntax:
    content: public NumberToken(string value, int startIndex)
    parameters:
    - id: value
      type: System.String
      description: The string representation of the numeric value. Must be a valid integer or floating-point number.
    - id: startIndex
      type: System.Int32
      description: The starting index of the token in the source string.
    content.vb: Public Sub New(value As String, startIndex As Integer)
