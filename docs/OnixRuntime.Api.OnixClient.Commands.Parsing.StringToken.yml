  assemblies:
  - OnixRuntime
  namespace: OnixRuntime.Api.OnixClient.Commands.Parsing
  summary: >-
    This parses a quoted string, handling escape characters, giving you the string with processed escape characters and how many character that took out of <code class="paramref">value</code>.

    You must include the two quotes in value, it will read until the closing quote or the end of value.
  example: []
  syntax:
    content: public static string ParseValue(ReadOnlySpan<char> value, out int consumed)
    parameters:
    - id: value
      type: System.ReadOnlySpan{System.Char}
      description: The string to extract the quoted string from, it will read what it needs and with <code class="paramref">consumed</code> you can know how much of it was this string.
    - id: consumed
      type: System.Int32
      description: ''
    return:
      type: System.String
      description: The processes string with escaped characters handled.
    content.vb: Public Shared Function ParseValue(value As ReadOnlySpan(Of Char), consumed As Integer) As String
