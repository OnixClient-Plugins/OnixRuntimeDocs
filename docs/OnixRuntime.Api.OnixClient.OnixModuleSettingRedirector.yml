  namespace: OnixRuntime.Api.OnixClient
  summary: >-
    Converts an OnixModule to a C# class string representation using the redirector pattern.

    This generates source code that can be used to recreate the module settings declaratively.
  example: []
  syntax:
    content: public static string ConvertModuleToRedirectorClass(OnixModule mod, string className, string desiredNamespace, bool includeHidden = true, bool useSaveName = false)
    parameters:
    - id: mod
      type: OnixRuntime.Api.OnixClient.OnixModule
      description: The OnixModule to convert.
    - id: className
      type: System.String
      description: The name for the generated class.
    - id: desiredNamespace
      type: System.String
      description: The namespace for the generated class.
    - id: includeHidden
      type: System.Boolean
      description: Whether to include hidden settings in the output.
    - id: useSaveName
      type: System.Boolean
      description: Whether to use save names instead of display names for property names.
    return:
      type: System.String
      description: A string containing the generated C# class code.
    content.vb: Public Shared Function ConvertModuleToRedirectorClass([mod] As OnixModule, className As String, desiredNamespace As String, includeHidden As Boolean = True, useSaveName As Boolean = False) As String
