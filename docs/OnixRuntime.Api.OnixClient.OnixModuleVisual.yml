  source:
    remote:
      path: OnixRuntime/Api/OnixClient/OnixModuleVisual.cs
      branch: dev
      repo: https://github.com/OnixClient-Plugins/OnixRuntime.git
    id: OnRender
    path: ../OnixRuntime/OnixRuntime/Api/OnixClient/OnixModuleVisual.cs
    startLine: 158
  assemblies:
  - OnixRuntime
  namespace: OnixRuntime.Api.OnixClient
  summary: >-
    Called everytime the module is rendered.

    If you're lazy just add a listener in 

    You could call it yourself, just make sure to check <xref href="OnixRuntime.Api.OnixClient.OnixModule.UsesLegacyRenderer" data-throw-if-not-resolved="false"></xref> to know when to call this on the Game(which you lost)'s renderer or the Direct2D renderer.

    This includes client UI, game UI, preview UI and whatever else the module will be asked to be rendered on.

    Which renderer you will get is based on use preference and <xref href="OnixRuntime.Api.OnixClient.OnixModule.UsesLegacyRenderer" data-throw-if-not-resolved="false"></xref>.

    If you have <xref href="OnixRuntime.Api.OnixClient.OnixModule.UsesLegacyRenderer" data-throw-if-not-resolved="false"></xref> set to true, you'll always get the Game's renderer.

    Otherwise, the default is the Direct2D renderer but the user could have disabled it, giving you the game's only.

    This callback will NEVER be logic, no touching gameplay objects. Gather that data elsewhere if you require it.
  example: []
  syntax:
    content: public virtual void OnRender(RendererCommon2D gfx)
    parameters:
    - id: gfx
      type: OnixRuntime.Api.Rendering.RendererCommon2D
      description: The 2D renderer used to draw the current state.
    content.vb: Public Overridable Sub OnRender(gfx As RendererCommon2D)
  overload: OnixRuntime.Api.OnixClient.OnixModuleVisual.OnRender*
