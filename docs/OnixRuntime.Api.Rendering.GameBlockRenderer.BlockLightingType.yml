  assemblies:
  - OnixRuntime
  namespace: OnixRuntime.Api.Rendering
  summary: >-
    This will bake the lighting with a color vertex attribute, not actually using normals

    <xref href="OnixRuntime.Api.Rendering.GameBlockRenderer.UseNormals" data-throw-if-not-resolved="false"></xref> should be turned false when using this, they are generally ignored by the game in this mode though.
  example: []
  syntax:
    content: BakedNoAmbientOcclusion = 1
    return:
      type: OnixRuntime.Api.Rendering.GameBlockRenderer.BlockLightingType
