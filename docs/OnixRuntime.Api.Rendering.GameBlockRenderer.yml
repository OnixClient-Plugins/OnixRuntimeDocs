    You should just set <xref href="OnixRuntime.Api.Rendering.GameBlockRenderer.CurrentBlock" data-throw-if-not-resolved="false"></xref> and <xref href="OnixRuntime.Api.Rendering.GameBlockRenderer.CurrentPosition" data-throw-if-not-resolved="false"></xref> then explicitly set <xref href="OnixRuntime.Api.Rendering.GameBlockRenderer.CurrentShapeSet" data-throw-if-not-resolved="false"></xref> to false.

    This will make the game retrieve the proper shape on its own, which will likely be better than what you will come up with.

    You can even collect it after it is done rendering the block too!
