  name: RenderBlock(GameMeshBuilder, BlockPos, Block)
  nameWithType: GameBlockRenderer.RenderBlock(GameMeshBuilder, BlockPos, Block)
  fullName: OnixRuntime.Api.Rendering.GameBlockRenderer.RenderBlock(OnixRuntime.Api.Rendering.GameMeshBuilder, OnixRuntime.Api.Maths.BlockPos, OnixRuntime.Api.World.Block)
  type: Method
  source:
    remote:
      path: OnixRuntime/Api/Rendering/GameBlockRenderer.cs
