    Note that this does not touch <xref href="OnixRuntime.Api.Rendering.GameBlockRenderer.UseOccluder" data-throw-if-not-resolved="false"></xref>. You are responsible for managing this bit yourself as it requires more flexibility than this simple function can provide.
