  assemblies:
  - OnixRuntime
  namespace: OnixRuntime.Api.Rendering
  summary: >-
    Returns the coordinates for this face on the <xref href="OnixRuntime.Api.Rendering.TexturePath.TerrainAtlas" data-throw-if-not-resolved="false"></xref>.

    This function needs no setup to properly work.
  example: []
  syntax:
    content: public TextureUVCoordinates GetTexture(BlockPos renderPosition, Block blockToRender, BlockFace blockFace, int forcedVariant = -1)
    parameters:
    - id: renderPosition
      type: OnixRuntime.Api.Maths.BlockPos
      description: >-
        This will be where the block will be rendered but the world block doesn't have to match the <code class="paramref">blockToRender</code>.

        The issue is that if you do <xref href="OnixRuntime.Api.Rendering.GameBlockRenderer.UseOccluder" data-throw-if-not-resolved="false"></xref>, this will use the <xref href="OnixRuntime.Api.Rendering.GameBlockRenderer.Cache" data-throw-if-not-resolved="false"></xref> to determine if it should be occluded or not.

        Now if the block you're trying to do isn't actually in the world, but you still want to occlude, you could manually fill up the cache.
    - id: blockToRender
      type: OnixRuntime.Api.World.Block
      description: The block you want to render.
    - id: blockFace
      type: OnixRuntime.Api.World.BlockFace
      description: >-
        The face of the block you're trying to render.

        Just remember, not everything is a full block and this won't give the best result on non-full blocks.
    - id: forcedVariant
      type: System.Int32
      description: This is to force a specific variant of a block, you should probably not touch that, the game half hardcodes values for those.
    return:
      type: OnixRuntime.Api.Rendering.TextureUVCoordinates
      description: The face's UV in the atlas.
    content.vb: Public Function GetTexture(renderPosition As BlockPos, blockToRender As Block, blockFace As BlockFace, forcedVariant As Integer = -1) As TextureUVCoordinates
