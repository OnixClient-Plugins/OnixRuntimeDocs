  summary: >-
    Allows you to render game blocks, this is a little more involved of a process than calling a magical render block function, but the results are pretty good.

    You get almost every block and their hardcoded behavior handled for you, occlusion if you set it up.

    It's still a lot less involved than implementing all of this yourself!
