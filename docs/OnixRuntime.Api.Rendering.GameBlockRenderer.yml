  summary: >-
    This is what the <xref href="OnixRuntime.Api.Rendering.GameBlockRenderer" data-throw-if-not-resolved="false"></xref> goes to everytime it needs a block.

    This lets you cheat by changing the cache yourself to manipulate the rendering.

    Very notably, <xref href="OnixRuntime.Api.Rendering.GameBlockRenderer.UseOccluder" data-throw-if-not-resolved="false"></xref> needs to be properly setup in order to work.

    The cache contains a region of 20x20x20 blocks, which is meant to be a subchunk and two blocks around it.

    Going outside the cache usually will lead to air being returned.
