- uid: OnixRuntime.Api.Rendering.GameBlockRenderer.RenderBlock(OnixRuntime.Api.Rendering.GameMeshBuilder,OnixRuntime.Api.Maths.BlockPos,OnixRuntime.Api.World.Block)
  commentId: M:OnixRuntime.Api.Rendering.GameBlockRenderer.RenderBlock(OnixRuntime.Api.Rendering.GameMeshBuilder,OnixRuntime.Api.Maths.BlockPos,OnixRuntime.Api.World.Block)
  id: RenderBlock(OnixRuntime.Api.Rendering.GameMeshBuilder,OnixRuntime.Api.Maths.BlockPos,OnixRuntime.Api.World.Block)
