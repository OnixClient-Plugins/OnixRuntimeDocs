    path: ../OnixRuntime/OnixRuntime/Api/Rendering/GameBlockRenderer.cs
    startLine: 609
  assemblies:
  - OnixRuntime
  namespace: OnixRuntime.Api.Rendering
  summary: >-
    The occluder is what allows the faces that aren't visible to not be rendered.

    This does not do camera based culling, only at the face level, seeing if a block is hiding that face.

    This is very useful but requires a little more work to work properly.

    You need to make sure the <xref href="OnixRuntime.Api.Rendering.GameBlockRenderer.Cache" data-throw-if-not-resolved="false"></xref> is properly filled up/reset with a position that can be accessed in the cache.

    The cache contains a region of 20x20x20 blocks, which is meant to be a subchunk and two blocks around it.

    Going outside the cache usually will lead to air being returned and no culling/occlusion.
