- uid: OnixRuntime.Api.Rendering.GameBlockRendererCache.Reset(OnixRuntime.Api.Maths.BlockPos)
  commentId: M:OnixRuntime.Api.Rendering.GameBlockRendererCache.Reset(OnixRuntime.Api.Maths.BlockPos)
  id: Reset(OnixRuntime.Api.Maths.BlockPos)
  parent: OnixRuntime.Api.Rendering.GameBlockRendererCache
  langs:
  - csharp
  - vb
  name: Reset(BlockPos)
  nameWithType: GameBlockRendererCache.Reset(BlockPos)
  fullName: OnixRuntime.Api.Rendering.GameBlockRendererCache.Reset(OnixRuntime.Api.Maths.BlockPos)
  type: Method
  source:
    remote:
      path: OnixRuntime/Api/Rendering/GameBlockRenderer.cs
      branch: dev
      repo: https://github.com/OnixClient-Plugins/OnixRuntime.git
    id: Reset
    path: ../OnixRuntime/OnixRuntime/Api/Rendering/GameBlockRenderer.cs
    startLine: 28
  assemblies:
  - OnixRuntime
  namespace: OnixRuntime.Api.Rendering
  summary: >-
    This resets the cache to an empty state, you should call this before doing anything with the cache.

    This will do -2 to the position you add to it, so you should just give it the start of your subchunk.

    This is obviously made to render subchunks, but if you're just rendering a single block, you can just give it that position as is.

    When rendering a subchunk, if you want the sides to render too, you can call <xref href="OnixRuntime.Api.Rendering.GameBlockRendererCache.SurroundInAir(System.Boolean%2cSystem.Boolean%2cSystem.Boolean)" data-throw-if-not-resolved="false"></xref> after this to make it believe the edges are air.
  example: []
  syntax:
    content: public void Reset(BlockPos worldSubChunkStartPosition)
    parameters:
    - id: worldSubChunkStartPosition
      type: OnixRuntime.Api.Maths.BlockPos
      description: The starting position of your sub chunk.
    content.vb: Public Sub Reset(worldSubChunkStartPosition As BlockPos)
  overload: OnixRuntime.Api.Rendering.GameBlockRendererCache.Reset*
- uid: OnixRuntime.Api.Rendering.GameBlockRendererCache.SurroundInAir(System.Boolean,System.Boolean,System.Boolean)
  commentId: M:OnixRuntime.Api.Rendering.GameBlockRendererCache.SurroundInAir(System.Boolean,System.Boolean,System.Boolean)
  id: SurroundInAir(System.Boolean,System.Boolean,System.Boolean)
  parent: OnixRuntime.Api.Rendering.GameBlockRendererCache
  langs:
  - csharp
  - vb
  name: SurroundInAir(bool, bool, bool)
  nameWithType: GameBlockRendererCache.SurroundInAir(bool, bool, bool)
  fullName: OnixRuntime.Api.Rendering.GameBlockRendererCache.SurroundInAir(bool, bool, bool)
  type: Method
  source:
    remote:
      path: OnixRuntime/Api/Rendering/GameBlockRenderer.cs
      branch: dev
      repo: https://github.com/OnixClient-Plugins/OnixRuntime.git
    id: SurroundInAir
    path: ../OnixRuntime/OnixRuntime/Api/Rendering/GameBlockRenderer.cs
    startLine: 40
  assemblies:
  - OnixRuntime
  namespace: OnixRuntime.Api.Rendering
  summary: >-
    Warning: Make sure the cache has been reset with a logical position for what you're trying to do before using this function.

    This surrounds the sub chunk in air, only in the cache of course, making it so that the edges of your subchunk will render properly when using <xref href="OnixRuntime.Api.Rendering.GameBlockRenderer.UseOccluder" data-throw-if-not-resolved="false"></xref>.

    Complete is just if you have messed with the cache before and need a complete reset of the edges to air.

    I would say only use complete if you see issues at the edge of the chunks and do more than only <xref href="OnixRuntime.Api.Rendering.GameBlockRendererCache.Reset(OnixRuntime.Api.Maths.BlockPos)" data-throw-if-not-resolved="false"></xref> and <xref href="OnixRuntime.Api.Rendering.GameBlockRendererCache.SurroundInAir(System.Boolean%2cSystem.Boolean%2cSystem.Boolean)" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: public void SurroundInAir(bool sides = true, bool topAndBottom = true, bool complete = false)
    parameters:
    - id: sides
      type: System.Boolean
      description: True if you want the sides to be surrounded by air.
    - id: topAndBottom
      type: System.Boolean
      description: True if you want the top and bottom faces to be surrounded
    - id: complete
      type: System.Boolean
      description: Whether to do a complete reset of the edges to air.
    content.vb: Public Sub SurroundInAir(sides As Boolean = True, topAndBottom As Boolean = True, complete As Boolean = False)
  overload: OnixRuntime.Api.Rendering.GameBlockRendererCache.SurroundInAir*
  nameWithType.vb: GameBlockRendererCache.SurroundInAir(Boolean, Boolean, Boolean)
  fullName.vb: OnixRuntime.Api.Rendering.GameBlockRendererCache.SurroundInAir(Boolean, Boolean, Boolean)
  name.vb: SurroundInAir(Boolean, Boolean, Boolean)
