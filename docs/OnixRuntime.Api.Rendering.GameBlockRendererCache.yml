    id: GameBlockRendererCache
    path: ../OnixRuntime/OnixRuntime/Api/Rendering/GameBlockRenderer.cs
    startLine: 18
  assemblies:
  - OnixRuntime
  namespace: OnixRuntime.Api.Rendering
  summary: >-
    IMPORTANT: You HAVE to <xref href="OnixRuntime.Api.Rendering.GameBlockRendererCache.Reset(OnixRuntime.Api.Maths.BlockPos)" data-throw-if-not-resolved="false"></xref> the cache if you plan on making use of it, getting or setting any values out of it.

    This is what the <xref href="OnixRuntime.Api.Rendering.GameBlockRenderer" data-throw-if-not-resolved="false"></xref> goes to everytime it needs a block.

    This lets you cheat by changing the cache yourself to manipulate the rendering.

    Very notably, <xref href="OnixRuntime.Api.Rendering.GameBlockRenderer.UseOccluder" data-throw-if-not-resolved="false"></xref> needs to be properly setup in order to work.

    Now this cache has a 20x20x20 area. You don't want to be rendering blocks outside of that.

    This cache is meant to contain a subchunk and two blocks outwards.

    You reset it with the starting position of your subchunk (+15 x,y,z should be the last/end position of the subchunk).

    Often, you will want the edges of your chunks to not be culled, so you can call <xref href="OnixRuntime.Api.Rendering.GameBlockRendererCache.SurroundInAir(System.Boolean%2cSystem.Boolean%2cSystem.Boolean)" data-throw-if-not-resolved="false"></xref> after resetting it to make it believe the edges are air.
