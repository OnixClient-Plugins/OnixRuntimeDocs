  namespace: OnixRuntime.Api.Rendering
  summary: >-
    Starts a new mesh builder session.

    Disposing the session will cause the mesh to be rendered.

    You should prefer the renderer's <xref href="OnixRuntime.Api.Rendering.IGameRenderer.NewMeshBuilderSession(OnixRuntime.Api.Rendering.TexturePath%2cOnixRuntime.Api.Rendering.MeshBuilderPrimitiveType%2cSystem.Nullable%7bOnixRuntime.Api.Maths.ColorF%7d)" data-throw-if-not-resolved="false"></xref> to this one since they will hand it to you in a more ready state based on its current parameters.
  example:
  - >-
    <pre><code class="lang-csharp">using (var mb = Onix.Render.Game.NewSession(...)) {
        //Define the vertices for the mesh however you want
        //mb.Vertex(...)
    }</code></pre>
  syntax:
    content: public GameMeshBuilder.GameMeshBuilderSession NewSession(TexturePath? texture = null, MeshBuilderPrimitiveType primitiveType = MeshBuilderPrimitiveType.Quad, ColorF? color = null, bool applyReverseOriginOffsetIf3D = true)
    parameters:
    - id: texture
      type: OnixRuntime.Api.Rendering.TexturePath
      description: The texture that will be used when rendering.
    - id: primitiveType
      type: OnixRuntime.Api.Rendering.MeshBuilderPrimitiveType
      description: The type of primitive the vertices will represent.
    - id: color
      type: System.Nullable{OnixRuntime.Api.Maths.ColorF}
      description: ''
    - id: applyReverseOriginOffsetIf3D
      type: System.Boolean
      description: If true, applies a reverse origin offset if the renderer is 3D. This makes it visible in 3d space.
    return:
      type: OnixRuntime.Api.Rendering.GameMeshBuilder.GameMeshBuilderSession
      description: The new session, don't forget to dispose it!
    content.vb: Public Function NewSession(texture As TexturePath = Nothing, primitiveType As MeshBuilderPrimitiveType = MeshBuilderPrimitiveType.Quad, color As ColorF? = Nothing, applyReverseOriginOffsetIf3D As Boolean = True) As GameMeshBuilder.GameMeshBuilderSession
