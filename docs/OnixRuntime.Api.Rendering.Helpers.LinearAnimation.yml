  summary: Gets the current linear animation value for highlight transitions.
  example: []
  syntax:
    content: public float GetLinear(float animationTime, bool isGoingUp = true, bool restartSmoothly = true)
    parameters:
    - id: animationTime
      type: System.Single
      description: The duration of the animation in seconds.
    - id: isGoingUp
      type: System.Boolean
      description: True if the highlight is increasing (mouse entered), false if decreasing (mouse exited).
    - id: restartSmoothly
      type: System.Boolean
      description: If true, the animation restarts smoothly on direction change; otherwise, it jumps to the edge.
    return:
      type: System.Single
      description: The current linear value between 0 and 1.
