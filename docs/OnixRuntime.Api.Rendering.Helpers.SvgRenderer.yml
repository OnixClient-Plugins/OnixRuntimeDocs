  assemblies:
  - OnixRuntime
  namespace: OnixRuntime.Api.Rendering.Helpers
  summary: >-
    This function is used to get a virtual <xref href="OnixRuntime.Api.Rendering.TexturePath" data-throw-if-not-resolved="false"></xref> for the SVG image rendering at a specific size.

    The default implementation constructs a path based on the renderer's base path and file name, appending the size in the format "{width}x{height}.png".

    If you need a different path structure or want to use a different method to get the texture path, you can override this function.

    It will upload the image for that size under whatever <xref href="OnixRuntime.Api.Rendering.TexturePath" data-throw-if-not-resolved="false"></xref> you return here.
