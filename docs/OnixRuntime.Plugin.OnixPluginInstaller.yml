  summary: >-
    A list of URLs representing remote sources for retrieving data or resources.

    <xref href="OnixRuntime.Plugin.OnixPluginInstaller.GetCuratedRemoteSourceUrls" data-throw-if-not-resolved="false"></xref> is the preferred way to get the list of urls to use. this will be for editing only.

    Remember to call <xref href="OnixRuntime.Plugin.OnixPluginInstaller.SaveRemoteSourceUrls" data-throw-if-not-resolved="false"></xref> when you modify this list.
